name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # assembleDebug is here on purpose: the app module has no unit tests, so
      # `test` alone never compiles it and a broken app module would go unnoticed.
      - name: Assemble, unit tests, static analysis, lint
        run: ./gradlew assembleDebug test ktlintCheck lint

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          retention-days: 7

  instrumentation:
    name: Instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # 24 is minSdk and 34 is close to what the app actually targets. The two
        # differ in ways this app touches — scoped storage, per-app language,
        # ImageDecoder — so a pass on one says little about the other.
        api-level: [24, 34]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator runs unusably slowly without hardware acceleration, and the
      # GitHub runner ships KVM present but not readable by the build user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports-api-${{ matrix.api-level }}
          path: '**/build/reports/androidTests/**'
          retention-days: 7
