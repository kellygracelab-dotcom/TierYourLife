name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # assembleDebug is here on purpose: the app module has no unit tests, so
      # `test` alone never compiles it and a broken app module would go unnoticed.
      - name: Assemble, unit tests, static analysis, lint
        run: ./gradlew assembleDebug test ktlintCheck lint detekt checkModuleBoundaries verifyRoborazziDebug koverXmlReport koverHtmlReport koverVerify

      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/coverage-summary.py build/reports/kover/report.xml >> "$GITHUB_STEP_SUMMARY"

      # The build that reaches people is shrunk by R8, which the debug build
      # never is: a class R8 strips or a rule it rejects would otherwise first
      # show up as a crash on a tester's phone. Unsigned, and the mapping file
      # stays here: uploading it is the release's job, not every PR's.
      - name: Release bundle
        run: ./gradlew :app:bundleRelease -x :app:uploadCrashlyticsMappingFileRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            build/reports/kover/**
            **/build/outputs/roborazzi/**
          retention-days: 7

  # Twenty emulator minutes for a change to a README read nothing new.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
          predicate-quantifier: 'every'

  instrumentation:
    name: Instrumentation tests
    needs: changes
    # A skipped job counts as passed, so a docs-only PR is not left waiting.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A run takes about ten minutes. One that is still going at thirty has hung,
    # and nothing a hung run does in its second half-hour is worth waiting for.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # 26 is minSdk and 34 is close to what the app actually targets. The two
        # differ in ways this app touches — scoped storage, per-app language,
        # ImageDecoder — so a pass on one says little about the other.
        api-level: [26, 34]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator runs unusably slowly without hardware acceleration, and the
      # GitHub runner ships KVM present but not readable by the build user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Booting a cold emulator costs more than running the tests on it. The
      # snapshot is built once per image and restored on every run after.
      - name: Cache the emulator snapshot
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-x86_64-4096M

      - name: Build the snapshot when there is nothing to restore
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          arch: x86_64
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disk-size: 4096M
          script: echo "Snapshot written."

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          # -no-snapshot-save so a run cannot leave its own leftovers in the
          # cached image and change what the next one starts from.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The default 800M image fills up while installing five test APKs, and a
          # full disk surfaces as an opaque "Failed to install-write all apks".
          disk-size: 4096M
          # The package verifier occasionally holds the install long enough for
          # ddmlib to give up; nothing here needs verifying.
          script: bash .github/scripts/instrumentation.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api-${{ matrix.api-level }}
          path: '**/build/reports/androidTests/**'
          retention-days: 7
