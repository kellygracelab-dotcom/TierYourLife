name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # assembleDebug is here on purpose: the app module has no unit tests, so
      # `test` alone never compiles it and a broken app module would go unnoticed.
      - name: Assemble, unit tests, static analysis, lint
        run: ./gradlew assembleDebug test ktlintCheck lint

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          retention-days: 7

  instrumentation:
    name: Instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # 24 is minSdk and 34 is close to what the app actually targets. The two
        # differ in ways this app touches — scoped storage, per-app language,
        # ImageDecoder — so a pass on one says little about the other.
        api-level: [24, 34]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator runs unusably slowly without hardware acceleration, and the
      # GitHub runner ships KVM present but not readable by the build user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Booting a cold emulator costs more than running the tests on it. The
      # snapshot is built once per image and restored on every run after.
      - name: Cache the emulator snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-x86_64-4096M

      - name: Build the snapshot when there is nothing to restore
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          arch: x86_64
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disk-size: 4096M
          script: echo "Snapshot written."

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          # -no-snapshot-save so a run cannot leave its own leftovers in the
          # cached image and change what the next one starts from.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The default 800M image fills up while installing five test APKs, and a
          # full disk surfaces as an opaque "Failed to install-write all apks".
          disk-size: 4096M
          # The package verifier occasionally holds the install long enough for
          # ddmlib to give up; nothing here needs verifying.
          script: bash .github/scripts/instrumentation.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          retention-days: 7

  instrumentation:
    name: Instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # 24 is minSdk and 34 is close to what the app actually targets. The two
        # differ in ways this app touches — scoped storage, per-app language,
        # ImageDecoder — so a pass on one says little about the other.
        api-level: [24, 34]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator runs unusably slowly without hardware acceleration, and the
      # GitHub runner ships KVM present but not readable by the build user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Booting a cold emulator costs more than running the tests on it. The
      # snapshot is built once per image and restored on every run after.
      - name: Cache the emulator snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-x86_64-4096M

      - name: Build the snapshot when there is nothing to restore
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          arch: x86_64
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disk-size: 4096M
          script: echo "Snapshot written."

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          # -no-snapshot-save so a run cannot leave its own leftovers in the
          # cached image and change what the next one starts from.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The default 800M image fills up while installing five test APKs, and a
          # full disk surfaces as an opaque "Failed to install-write all apks".
          disk-size: 4096M
          # The package verifier occasionally holds the install long enough for
          # ddmlib to give up; nothing here needs verifying.
          script: |
            adb shell settings put global verifier_verify_adb_installs 0
            ./gradlew connectedDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports-api-${{ matrix.api-level }}
          path: '**/build/reports/androidTests/**'
          retention-days: 7
