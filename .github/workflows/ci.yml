name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The jobs only read: they check out code, build and test. Said here rather
# than left to the repository's default, so a change of that default gives
# them nothing more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Every action is pinned to the commit of the release named beside it: a tag
# can be moved to other code, a commit cannot.
jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # assembleDebug is here on purpose: the app module has no unit tests, so
      # `test` alone never compiles it and a broken app module would go unnoticed.
      - name: Assemble, unit tests, static analysis, lint
        run: ./gradlew assembleDebug test ktlintCheck lint detekt checkModuleBoundaries verifyRoborazziDebug koverXmlReport koverHtmlReport koverVerify

      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/coverage-summary.py build/reports/kover/report.xml >> "$GITHUB_STEP_SUMMARY"

      # The build that reaches people is shrunk by R8, which the debug build
      # never is: a class R8 strips or a rule it rejects would otherwise first
      # show up as a crash on a tester's phone. Unsigned, and the mapping file
      # stays here: uploading it is the release's job, not every PR's.
      - name: Release bundle
        run: ./gradlew :app:bundleRelease -x :app:uploadCrashlyticsMappingFileRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            build/reports/kover/**
            **/build/outputs/roborazzi/**
          retention-days: 7

  ci-passed:
    name: Android CI passed
    needs: [build, changes, e2e, instrumentation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          E2E_RESULT: ${{ needs.e2e.result }}
          INSTRUMENTATION_RESULT: ${{ needs.instrumentation.result }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          test "$CHANGES_RESULT" = success
          case "$CODE_CHANGED" in
            true)
              test "$E2E_RESULT" = success
              test "$INSTRUMENTATION_RESULT" = success
              ;;
            false)
              for result in "$E2E_RESULT" "$INSTRUMENTATION_RESULT"; do
                case "$result" in success|skipped) ;; *) exit 1 ;; esac
              done
              ;;
            *) exit 1 ;;
          esac

  # Twenty emulator minutes for a change to a README read nothing new.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
          predicate-quantifier: 'every'

  # The app's own network, sync and publishing against the proxy's real code in
  # the Firebase emulators, as the proxy's CONTRACT.md describes them: no keys,
  # no login, nothing leaves the runner.
  e2e:
    name: End-to-end against the proxy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # About five minutes; one at twenty is a request nobody answers.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The proxy's main as it is today, on purpose not pinned to a commit:
      # telling the app when a change there breaks it is what this job is for.
      - name: Checkout the proxy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kellygracelab-dotcom/tieryourlife-proxy
          ref: main
          path: proxy

      # Gradle and the Firestore emulator both run on it.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: proxy/functions/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # An exact version, as a lock file would hold it; the emulators' cache
      # below is kept per version too.
      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15.34.2

      - name: Cache the emulators
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.34.2

      # Built first, so the emulators are up only while the tests run.
      - name: Build the tests
        run: ./gradlew :e2e:testDebugUnitTest

      # The command runs in proxy/functions, so it goes back to the checkout by name.
      - name: End-to-end tests
        run: |
          npm --prefix proxy/functions ci
          npm --prefix proxy/functions run emulators:e2e:exec -- "cd \"$GITHUB_WORKSPACE\" && ./gradlew :e2e:testDebugUnitTest -Pe2e"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            e2e/build/reports/tests/**
            proxy/functions/*-debug.log
            proxy/*-debug.log
          retention-days: 7

  instrumentation:
    name: Instrumentation tests
    needs: changes
    # A skipped job counts as passed, so a docs-only PR is not left waiting.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A run takes about ten minutes. One that is still going at thirty has hung,
    # and nothing a hung run does in its second half-hour is worth waiting for.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # 26 is minSdk and 34 is close to what the app actually targets. The two
        # differ in ways this app touches — scoped storage, per-app language,
        # ImageDecoder — so a pass on one says little about the other.
        api-level: [26, 34]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The emulator runs unusably slowly without hardware acceleration, and the
      # GitHub runner ships KVM present but not readable by the build user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          # A cold boot every time. The snapshot that used to be cached never
          # loaded ("different AVD configuration") and left an API 26 emulator
          # unable to exit, which cost the whole timeout after a green run.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The default 800M image fills up while installing five test APKs, and a
          # full disk surfaces as an opaque "Failed to install-write all apks".
          disk-size: 4096M
          # The package verifier occasionally holds the install long enough for
          # ddmlib to give up; nothing here needs verifying.
          script: bash .github/scripts/instrumentation.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-reports-api-${{ matrix.api-level }}
          path: '**/build/reports/androidTests/**'
          retention-days: 7
