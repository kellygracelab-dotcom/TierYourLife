// What the screens are drawn from, read-only by construction but built in
// modules the Compose compiler never sees. Without this every List and every
// domain model is "unstable", and a list of equal cards that arrives as new
// instances (the network answer after the kept page, every board reload after
// a move) recomposes every card on screen instead of skipping them.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
com.artiuillab.tieryourlife.feature.tier.domain.model.*
com.artiuillab.tieryourlife.feature.community.domain.model.*
